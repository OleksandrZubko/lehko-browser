name: Build Lehko Chromium (macOS arm64)

# The Chromium build outlasts the 6h limit of a GitHub-hosted job, so it runs as a chain
# of resumable stages (see build-stage.yml). Each stage saves the tree for the next one;
# stages after the one that finishes are skipped, and the package job turns the app into a DMG.

on:
  workflow_dispatch:
    inputs:
      chromium_version:
        description: 'Chromium Stable Version (e.g. 156.0.8078.83)'
        required: true
        default: '156.0.8078.83'
      apply_patches:
        description: 'Apply patches/series (off = unmodified Chromium baseline)'
        type: boolean
        required: true
        default: true
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        required: true
        default: true
      resume_from_run:
        description: 'Run ID to resume from (its newest chromium-state-* artifact); empty = fresh checkout'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  stage1:
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 1
      chromium_version: ${{ inputs.chromium_version }}
      apply_patches: ${{ inputs.apply_patches }}
      state_run: ${{ inputs.resume_from_run }}

  stage2:
    needs: stage1
    if: ${{ needs.stage1.outputs.done == 'false' }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 2
      chromium_version: ${{ inputs.chromium_version }}
      apply_patches: ${{ inputs.apply_patches }}
      state_run: ${{ github.run_id }}
      state_artifact: chromium-state-1

  stage3:
    needs: stage2
    if: ${{ needs.stage2.outputs.done == 'false' }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 3
      chromium_version: ${{ inputs.chromium_version }}
      apply_patches: ${{ inputs.apply_patches }}
      state_run: ${{ github.run_id }}
      state_artifact: chromium-state-2

  stage4:
    needs: stage3
    if: ${{ needs.stage3.outputs.done == 'false' }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 4
      chromium_version: ${{ inputs.chromium_version }}
      apply_patches: ${{ inputs.apply_patches }}
      state_run: ${{ github.run_id }}
      state_artifact: chromium-state-3

  stage5:
    needs: stage4
    if: ${{ needs.stage4.outputs.done == 'false' }}
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 5
      chromium_version: ${{ inputs.chromium_version }}
      apply_patches: ${{ inputs.apply_patches }}
      state_run: ${{ github.run_id }}
      state_artifact: chromium-state-4

  package:
    name: Package DMG
    needs: [stage1, stage2, stage3, stage4, stage5]
    # Later stages are skipped once one finishes, so look for any stage that built the app.
    if: ${{ !cancelled() && contains(needs.*.outputs.done, 'true') }}
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build Lehko Extension & Rules
        run: |
          npm ci
          npm run build
          test -d dist && echo "Extension built successfully into dist/"

      - name: Download Chromium.app
        uses: actions/download-artifact@v4
        with:
          name: chromium-app
          path: ${{ runner.temp }}

      - name: Package DMG Installer with Embedded Modules
        run: |
          mkdir -p chromium_app
          tar -xpf "$RUNNER_TEMP/chromium-app.tar" -C chromium_app
          chmod +x ci/*.sh
          ./ci/package-dmg.sh chromium_app/Chromium.app Lehko-arm64.dmg dist

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lehko-arm64-dmg
          path: Lehko-arm64.dmg
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.chromium_version }}"
          name: "Lehko Browser v${{ github.event.inputs.chromium_version }} (Apple Silicon)"
          body: |
            ## Легко Browser (Apple Silicon ARM64)
            - **Повноцінний автономний браузер** на базі Chromium ${{ github.event.inputs.chromium_version }}.
            - **Вмонтований функціонал:** папки вкладок (Workspaces), блокування сміття та трекерів (DNR), вивантаження неактивної пам'яті.
            - **Вшиті Lean-налаштування:** вимкнено телеметрію, Lens, фонові AI-моделі та Cast-демони.
            - **Апаратне відео:** апаратне декодування VP9/H.264 замість AV1 для збереження батареї на Apple Silicon M1/M2/M3/M4.
            - **Нативні DevTools:** повна підтримка інструментів розробника для QA-тестування.
          files: Lehko-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
