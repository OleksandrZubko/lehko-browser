name: Build Lehko Chromium (macOS arm64)

on:
  workflow_dispatch:
    inputs:
      chromium_version:
        description: 'Chromium Stable Version (e.g. 132.0.6834.110)'
        required: true
        default: '132.0.6834.110'
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build Chromium Apple Silicon (arm64)
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build Lehko Extension & Rules
        run: |
          npm ci
          npm run build
          test -d dist && echo "Extension built successfully into dist/"

      - name: Free disk space on runner
        run: |
          chmod +x ci/*.sh
          ./ci/clean-disk.sh

      - name: Install build prerequisites & bootstrap depot_tools
        run: |
          brew install ninja ccache
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> $GITHUB_PATH
          export PATH="$RUNNER_TEMP/depot_tools:$PATH"
          echo "Bootstrapping depot_tools..."
          "$RUNNER_TEMP/depot_tools/update_depot_tools" || true

          echo "Installing official native GN binary for macOS arm64..."
          mkdir -p "$RUNNER_TEMP/gn_bin"
          cipd install "gn/gn/mac-arm64" latest -root "$RUNNER_TEMP/gn_bin"
          echo "$RUNNER_TEMP/gn_bin" >> $GITHUB_PATH
          export PATH="$RUNNER_TEMP/gn_bin:$PATH"
          "$RUNNER_TEMP/gn_bin/gn" --version

      - name: Download Chromium source tarball
        run: |
          VERSION="${{ github.event.inputs.chromium_version }}"
          echo "Downloading Chromium $VERSION..."
          mkdir -p chromium_src
          curl -fSL "https://commondatastorage.googleapis.com/chromium-browser-official/chromium-${VERSION}.tar.xz" -o chromium.tar.xz
          echo "Extracting tarball (this may take a few minutes)..."
          tar -xf chromium.tar.xz -C chromium_src --strip-components=1
          rm -f chromium.tar.xz
          echo "Extracted source tree successfully."

      - name: Setup Clang Toolchain and Apply Lehko Patches
        run: |
          cd chromium_src
          export PATH="$RUNNER_TEMP/gn_bin:$RUNNER_TEMP/depot_tools:$PATH"

          echo "Fetching Chromium pinned Clang compiler..."
          python3 tools/clang/scripts/update.py

          echo "Fetching Chromium pinned Rust toolchain..."
          python3 tools/rust/update_rust.py

          # The tarball is exported from a Linux checkout, so the macOS Node binary that
          # gclient hooks normally download is missing; point Chromium at the runner's Node.
          echo "Linking runner Node.js into third_party/node..."
          mkdir -p third_party/node/mac_arm64/node-darwin-arm64/bin
          ln -sf "$(command -v node)" third_party/node/mac_arm64/node-darwin-arm64/bin/node
          third_party/node/mac_arm64/node-darwin-arm64/bin/node --version

          echo "Applying AV1 hardware fallback patch..."
          patch -p1 < ../patches/01-disable-av1.patch || true

          echo "Setting up Lean GN arguments..."
          mkdir -p out/Release
          cp ../patches/args.gn out/Release/args.gn

      - name: Generate build files (gn gen)
        run: |
          cd chromium_src
          export PATH="$RUNNER_TEMP/gn_bin:$RUNNER_TEMP/depot_tools:$PATH"
          gn gen out/Release

      - name: Compile Chromium (ninja)
        run: |
          cd chromium_src
          export PATH="$RUNNER_TEMP/gn_bin:$RUNNER_TEMP/depot_tools:$PATH"
          ninja -C out/Release chrome

      - name: Package DMG Installer with Embedded Modules
        run: |
          ./ci/package-dmg.sh chromium_src/out/Release/Chromium.app Lehko-arm64.dmg dist

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lehko-arm64-dmg
          path: Lehko-arm64.dmg
          retention-days: 14

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.chromium_version }}"
          name: "Lehko Browser v${{ github.event.inputs.chromium_version }} (Apple Silicon)"
          body: |
            ## Легко Browser (Apple Silicon ARM64)
            - **Повноцінний автономний браузер** на базі Chromium ${{ github.event.inputs.chromium_version }}.
            - **Вмонтований функціонал:** папки вкладок (Workspaces), блокування сміття та трекерів (DNR), вивантаження неактивної пам'яті.
            - **Вшиті Lean-налаштування:** вимкнено телеметрію, Lens, фонові AI-моделі та Cast-демони.
            - **Апаратне відео:** апаратне декодування VP9/H.264 замість AV1 для збереження батареї на Apple Silicon M1/M2/M3/M4.
            - **Нативні DevTools:** повна підтримка інструментів розробника для QA-тестування.
          files: Lehko-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
